name: Amazon Telegram Deal Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes automatically
  workflow_dispatch:        # Lets you click a button to test it immediately

permissions:
  contents: write           # Allows the bot to save posted_asins.txt back to the repo

jobs:
  post-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 feedparser

      - name: Run Amazon Deal Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python amazon_bot.py

      - name: Save posted deals history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_asins.txt
          git diff --staged --quiet || git commit -m "Update posted deals history [skip ci]"
          git push
